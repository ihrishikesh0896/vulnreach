name: CI

on:
  push:
    branches: ["main", "master", "dev/**"]
  pull_request:

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

  # ── Unit tests + coverage gate ────────────────────────────────────────────
  test:
    name: Unit tests (coverage ≥ 60%)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: vulnreach
          POSTGRES_PASSWORD: vulnreach
          POSTGRES_DB: vulnreach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vulnreach"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://vulnreach:vulnreach@localhost:5432/vulnreach_test
      JWT_SECRET: ${{ github.run_id }}-${{ github.sha }}-ci
      BCRYPT_ROUNDS: "4"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov coverage tainter

      - name: Run unit + integration tests with coverage
        run: |
          # Threshold is a ratchet, not a target. The previous 60% was never
          # enforced: this step also passed --cov-omit, which is not a
          # pytest-cov option (it has never existed), so pytest exited during
          # argument parsing and the gate never ran. Measured coverage is ~22%,
          # so 20 is set just below it — raise this as coverage grows; never
          # lower it. Omit rules now live in pyproject.toml [tool.coverage.run].
          pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-fail-under=20 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage

  # ── Deterministic language fixtures (monorepo readiness gate) ─────────────
  language-fixtures:
    name: Language Fixture (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java, javascript, go]

    env:
      VULNREACH_FIXTURE_LANGUAGE: ${{ matrix.language }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run deterministic fixture tests
        run: |
          pytest -q tests/test_language_fixtures.py tests/test_scan_response_contract.py

  # ── Dependency vulnerability audit + SBOM (ratchet gate) ───────────────────
  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit (JSON report)
        run: pip-audit -r requirements.txt --format json --output pip-audit-report.json || true
        # pip-audit exits non-zero whenever it finds anything; we evaluate the
        # report ourselves below against a ratchet baseline instead of trusting
        # the raw exit code, so a non-zero exit here is expected, not a failure.

      - name: Generate CycloneDX SBOM
        run: pip-audit -r requirements.txt --format cyclonedx-json --output sbom.cyclonedx.json || true

      - name: Enforce vulnerability ratchet
        run: |
          python3 - <<'PY'
          import json, sys

          # Ratchet, not a target — same pattern as the coverage gate above.
          # Baseline is the unique known-vulnerability count measured on
          # 2026-09-30 via `pip-audit -r requirements.txt`: 93 across 17 of 91
          # pinned packages (aiohttp, pillow, pyjwt, starlette, cryptography,
          # etc). CI fails only if that count grows. Lower BASELINE as
          # dependencies get upgraded and vulnerabilities are resolved; never
          # raise it just to make a failing build pass.
          BASELINE = 93

          with open("pip-audit-report.json") as f:
              data = json.load(f)

          ids = set()
          for pkg in data.get("dependencies", []):
              for v in pkg.get("vulns", []):
                  ids.add(v["id"])

          count = len(ids)
          print(f"Unique known vulnerabilities: {count} (baseline {BASELINE})")
          if count > BASELINE:
              print(
                  f"::error::Vulnerability count increased ({BASELINE} -> {count}). "
                  "A newly pinned or updated dependency introduced a known "
                  "vulnerability. Pin a fixed version, or if unavoidable, "
                  "lower-bound this check deliberately with a comment explaining why."
              )
              sys.exit(1)
          PY

      - name: Upload audit report + SBOM
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: |
            pip-audit-report.json
            sbom.cyclonedx.json

  # ── Docker image build (smoke test) ───────────────────────────────────────
  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag vulnreach-agent:ci-${{ github.sha }} \
            --file Dockerfile \
            .
