scan:
  static_reachability: true
  tools:
    - git
    - trivy                # SCA — CVEs in installed packages
    - tainter              # taint analysis (source→sink tracing)
    - python_reachability  # AST call-chain analysis
    - route_extractor      # HTTP route map
    - metadata             # PyPI → importable name resolution
    - dynamic_reachability # Docker-based runtime coverage

  runtime:
    enabled: false
    # timeout: 180           # Django multi-tier needs more startup time
    # coverage_wait: 15      # wait after Schemathesis traffic before flushing
    # container_port: 3000   # Django backend port
    # ebpf:
    #   enabled: false        # non-invasive eBPF tracing via bpftrace
    #   mode: openat         # trace file-open syscalls (portable, no USDT needed)
    #   tracer: bpftrace
    #   sidecar_mode: false  # direct tracing from vulnreach container (not sidecar)
    #   kernel_check: true   # log advisory if kernel < 4.9 / < 5.2
    #   language: python     # Django is a Python runtime

  openapi_generator:
    enabled: false         # openapi.json already present in repo

  intelligent_dast:
    enabled: false

risk:
  exposure: public
  data_sensitivity: high

policy:
  block_if:
    - severity: CRITICAL
      verdict: CONFIRMED
    - severity: HIGH
      verdict: CONFIRMED

notifications:
  slack: true